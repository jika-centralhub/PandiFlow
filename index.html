  <script>
    // Filet de sécurité : si l'écran ne rafraîchit pas les images (onglet en arrière-plan,
    // navigateur de télé économe…), les animations repassent sur un minuteur.
    (function () {
      var raf = window.requestAnimationFrame, caf = window.cancelAnimationFrame, dead = {};
      if (!raf) return;
      window.requestAnimationFrame = function (cb) {
        var done = false, id = raf.call(window, function (t) { if (done || dead[id]) return; done = true; cb(t); });
        setTimeout(function () { if (!done && !dead[id]) { done = true; cb(performance.now()); } delete dead[id]; }, 60);
        return id;
      };
      window.cancelAnimationFrame = function (id) { dead[id] = 1; caf.call(window, id); };
    })();
  </script>

  <!-- Écran de lancement : visible dès l'ouverture, effacé par main.js quand l'app est prête.
       Mêmes couleurs que l'icône (tools/make_icons.py) : changer les deux ensemble. -->
  <style id="splash-css">
    #splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(circle at 12% 8%, rgba(255, 244, 196, .9), rgba(255, 244, 196, 0) 55%),
        linear-gradient(to bottom right, #FFDE6E, #FFB24F 30%, #FF8D72 55%, #9A5AA8 78%, #2E2C78);
      transition: opacity .45s ease; }
    #splash.out { opacity: 0; pointer-events: none; }
    #splash .sp-mark { width: 40vmin; height: 40vmin; max-width: 280px; max-height: 280px; animation: sp-bob 3s ease-in-out infinite; }
    #splash .sp-name { margin-top: 2vmin; font: 500 min(10vmin, 64px)/1.1 'Fredoka', system-ui, sans-serif; color: #1F1B2E; }
    #splash .sp-hi { min-height: 1.3em; margin-top: 1vmin; font: 500 min(4.6vmin, 28px)/1.3 'Fredoka', system-ui, sans-serif; color: #1F1B2E;
      opacity: 0; animation: sp-in .6s .2s ease forwards; }
    #splash .sp-star { position: absolute; width: 1vmin; height: 1vmin; border-radius: 50%; background: #fff; opacity: .75; }
    #splash .sp-eye { transform-box: fill-box; transform-origin: center; animation: sp-blink 3.8s 1s infinite; }
    #splash.still *, #splash.still { animation: none !important; transition: none; }
    @keyframes sp-bob { 50% { transform: translateY(-1.5vmin); } }
    @keyframes sp-blink { 0%, 90%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.1); } }
    @keyframes sp-in { to { opacity: .8; } }
    @media (prefers-reduced-motion: reduce) { #splash .sp-mark, #splash .sp-eye { animation: none; } }
  </style>
</head>

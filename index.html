  <script>
    // Filet de sécurité : si l'écran ne rafraîchit pas les images (onglet en arrière-plan,
    // navigateur de télé économe…), les animations repassent sur un minuteur.
    (function () {
      var raf = window.requestAnimationFrame, caf = window.cancelAnimationFrame, dead = {};
      if (!raf) return;
      window.requestAnimationFrame = function (cb) {
        var done = false, id = raf.call(window, function (t) { if (done || dead[id]) return; done = true; cb(t); });
        setTimeout(function () { if (!done && !dead[id]) { done = true; cb(performance.now()); } delete dead[id]; }, 60);
        return id;
      };
      window.cancelAnimationFrame = function (id) { dead[id] = 1; caf.call(window, id); };
    })();
  </script>

<!doctype html>
<!-- E-mail de Pandi à l'inscription : le code à 6 chiffres qui confirme l'adresse du parent.
     Pas de lien : il s'ouvrirait dans Safari et pas dans l'icône de l'écran d'accueil (iPhone). -->
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ton code Pandi</title></head>
<body style="margin:0;padding:0;background:#f4f0ff;font-family:Arial,Helvetica,sans-serif;color:#2b2350;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f0ff;padding:24px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:20px;padding:28px 24px;text-align:center;">
        <tr><td><img src="https://www.pandiflow.com/assets/icons/icon-192.png" width="72" height="72" alt="Pandi" style="border-radius:18px;"></td></tr>
        <tr><td style="font-size:22px;font-weight:bold;padding:14px 0 8px;">Bienvenue dans Pandi !</td></tr>
        <tr><td style="font-size:16px;line-height:1.5;padding-bottom:18px;">Pour confirmer ton adresse e-mail, tape ce code dans Pandi :</td></tr>
        <tr><td style="padding-bottom:18px;"><span style="display:inline-block;font-size:34px;font-weight:bold;letter-spacing:8px;padding:14px 22px;border-radius:14px;background:#f3effd;color:#4a3bb8;">{{ .Token }}</span></td></tr>
        <tr><td style="font-size:14px;line-height:1.5;color:#6b6390;">Le code est valable 1 heure.<br>Tu n'as pas créé de compte Pandi ? Ignore simplement cet e-mail.</td></tr>
      </table>
      <p style="font-size:12px;color:#8a83a8;margin:16px 0 0;">Pandi · www.pandiflow.com · Une question ? Réponds à cet e-mail.</p>
    </td></tr>
  </table>
</body>
</html>

# Réglages Supabase du projet PandiFlow, envoyés avec :
#   supabase config push --project-ref kyhhkhmwdostzdaksxzw
# Seules les propriétés déclarées ici sont modifiées sur le projet.
# La connexion Google (identifiant et secret) se règle dans le tableau de bord
# Supabase : Authentication > Sign In / Providers > Google. Elle n'est pas déclarée
# ici pour que le secret ne soit jamais dans le dépôt.
project_id = "pandiflow"

[auth]
site_url = "https://www.pandiflow.com"
# Les adresses http restent permises tant que le https de GitHub Pages n'est pas actif
additional_redirect_urls = ["https://www.pandiflow.com/**", "https://pandiflow.com/**", "http://www.pandiflow.com/**", "http://pandiflow.com/**", "http://localhost:8080/**"]
minimum_password_length = 8

# Connexion par e-mail et mot de passe. Pas d'e-mail de confirmation : le service d'e-mail
# gratuit de Supabase n'écrit qu'aux membres de l'organisation. L'accès à une famille reste
# protégé par les invitations à usage unique.
[auth.email]
enable_signup = true
enable_confirmations = false

[functions.analyze-photo]
# La fonction vérifie elle-même la session du parent
verify_jwt = false

[functions.make-portrait]
# La fonction vérifie elle-même la session du parent
verify_jwt = false
